# Run `source set-env` located in project directory before running `docker compose up -d`
POSTGRES_HOST=localhost
POSTGRES_PORT=15432
POSTGRES_DB=postgres
POSTGRES_USER=postgres
POSTGRES_PASSWORD=secretpw

#Currently no seperate user for GPM service. Can add later.
POSTGRES_GPM_SCHEMA=gpm

# Flyway (remember to keep placeholders in sync with spring configuration files)
FLYWAY_SCHEMAS=$POSTGRES_GPM_SCHEMA
FLYWAY_URL=jdbc:postgresql://$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB
FLYWAY_USER=$POSTGRES_USER
FLYWAY_PASSWORD=$POSTGRES_PASSWORD
FLYWAY_LOCATIONS=filesystem:./src/main/resources/db/migration
FLYWAY_CLEAN_DISABLED=false

FLYWAY_PLACEHOLDERS_GPM_SCHEMA=$POSTGRES_GPM_SCHEMA
