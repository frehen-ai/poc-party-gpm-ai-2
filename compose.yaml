# Run `source set-env` in project directory before running `docker compose up -d`
# (or use `docker compose --env-file .env.properties up -d`). Do not rely on .env: it is reserved for private secrets.
services:
  db:
    image: postgres:15.3
    environment:
      - POSTGRES_HOST=$POSTGRES_HOST
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    ports:
      - "$POSTGRES_PORT:5432"
